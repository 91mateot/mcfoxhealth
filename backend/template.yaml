AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mateo Fitness Dashboard — serverless backend

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        HEALTH_METRICS_TABLE: !Ref HealthMetricsTable
        DAILY_SCORES_TABLE: !Ref DailyScoresTable
        WORKOUTS_TABLE: !Ref WorkoutsTable
        NUTRITION_TABLE: !Ref NutritionTable
        JOURNAL_TABLE: !Ref JournalTable
        BASELINES_TABLE: !Ref BaselinesTable
        CORRELATIONS_TABLE: !Ref CorrelationsTable
        USER_CONFIG_TABLE: !Ref UserConfigTable
        CALIBRATION_TABLE: !Ref CalibrationTable
        EXERCISES_TABLE: !Ref ExercisesTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        FEEDBACK_TABLE: !Ref FeedbackTable
        EVENTS_TABLE: !Ref EventsTable
        SECRETS_ARN: !Ref SecretsArn
        INGEST_API_KEY: !Ref IngestApiKey

Parameters:
  SecretsArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding API keys and OAuth tokens
    Default: ''
  IngestApiKey:
    Type: String
    Description: API key for HealthAutoExport ingest endpoint
    Default: 'fitness-hae-2026'
    NoEcho: true
  AlertEmail:
    Type: String
    Description: Email address to notify on budget threshold breaches. Leave blank to skip the Budget resource.
    Default: ''
  BudgetMonthlyUsd:
    Type: Number
    Description: Monthly USD budget for the stack. Alerts fire at 80% actual and 100% forecast.
    Default: 20

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:

  # ── HTTP API ─────────────────────────────────────────────────
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/fitness-dashboard
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - x-api-key
        MaxAge: 3600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationStatus":"$context.integrationStatus","integrationErrorMessage":"$context.integrationErrorMessage","error":"$context.error.message","userAgent":"$context.identity.userAgent","sourceIp":"$context.identity.sourceIp"}'

  # ── DynamoDB Tables ──────────────────────────────────────────
  HealthMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-health-metrics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: metric_source
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: metric_source
          KeyType: RANGE

  DailyScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-daily-scores
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH

  WorkoutsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-workouts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: strava_id
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: strava_id
          KeyType: RANGE

  NutritionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-nutrition
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: meal_id
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: meal_id
          KeyType: RANGE

  JournalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-journal
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH

  BaselinesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-baselines
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: type
          KeyType: HASH

  CorrelationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-correlations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tag
          AttributeType: S
        - AttributeName: metric
          AttributeType: S
      KeySchema:
        - AttributeName: tag
          KeyType: HASH
        - AttributeName: metric
          KeyType: RANGE

  UserConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-user-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH

  CalibrationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-calibration
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH

  ExercisesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-exercises
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: canonical
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: canonical
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: conversation_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: conversation_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-updated
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-feedback
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: target_key
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: target_key
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-updated
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fitness-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: event_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Lambda Layer (shared Python package) ─────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: fitness-shared
      ContentUri: shared/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  # ── Lambda Functions ─────────────────────────────────────────

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ingest/
      Handler: handler.lambda_handler
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HealthMetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkoutsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:UpdateSecret
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fitness-api-key-*'
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:withings-oauth-*'
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:strava-oauth-*'
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ComputeFunction.Arn
      Environment:
        Variables:
          COMPUTE_FUNCTION_NAME: !Ref ComputeFunction
      Events:
        IngestHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/health
            Method: POST
        IngestWithings:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/withings
            Method: POST
        IngestStrava:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/strava
            Method: POST
        StravaVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest/strava
            Method: GET

  ComputeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/compute/
      Handler: handler.lambda_handler
      Timeout: 120
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HealthMetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BaselinesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref JournalTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CorrelationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NutritionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkoutsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExercisesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        DailyBaselines:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Description: Daily baseline computation (2am PT = 9am UTC)
        WeeklyCorrelations:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 ? * SUN *)
            Description: Weekly correlation computation (6am PT Sunday = 1pm UTC)

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api/
      Handler: handler.lambda_handler
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HealthMetricsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyScoresTable
        - DynamoDBReadPolicy:
            TableName: !Ref WorkoutsTable
        - DynamoDBReadPolicy:
            TableName: !Ref NutritionTable
        - DynamoDBReadPolicy:
            TableName: !Ref JournalTable
        - DynamoDBReadPolicy:
            TableName: !Ref BaselinesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CorrelationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExercisesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConversationsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fitness-api-key-*'
        - Statement:
            - Effect: Allow
              Action:
                - ce:GetCostAndUsage
              Resource: '*'
      Events:
        GetToday:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/today
            Method: GET
        GetWorkouts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/workouts
            Method: GET
        GetNutritionHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/nutrition/history
            Method: GET
        GetNutrition:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/nutrition/{date}
            Method: GET
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/progress
            Method: GET
        GetInsights:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/insights
            Method: GET
        GetLatestConversation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/conversation/latest
            Method: GET
        ListConversations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/conversation/list
            Method: GET
        GetConversationById:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/conversation/{conversationId}
            Method: GET
        GetJournalHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/journal/history
            Method: GET
        RefreshPlannedWorkout:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/planned-workout/refresh
            Method: POST
        GetInfraCost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/infra-cost
            Method: GET

  NutritionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-NutritionFunction'
      CodeUri: functions/nutrition/
      Handler: handler.lambda_handler
      Timeout: 30
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          NUTRITION_FUNCTION_NAME: !Sub '${AWS::StackName}-NutritionFunction'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NutritionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref JournalTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CalibrationTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkoutsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExercisesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedbackTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fitness-api-key-*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-NutritionFunction'
      Events:
        PostMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/meal
            Method: POST
        PostMealEstimate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/meal/estimate
            Method: POST
        PatchMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/meal/{date}/{meal_id}
            Method: PATCH
        DeleteMeal:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/meal/{date}/{meal_id}
            Method: DELETE
        GetFavorites:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/favorites
            Method: GET
        PostFavorite:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/favorites
            Method: POST
        DeleteFavorite:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/favorites/{id}
            Method: DELETE
        PostWater:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/water
            Method: POST
        DeleteWater:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/water/{date}/{water_id}
            Method: DELETE
        PostJournal:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/journal
            Method: POST
        PostJournalPrompts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/journal/prompts
            Method: POST
        PatchJournalNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/journal/note
            Method: PATCH
        DeleteJournalNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/journal/note
            Method: DELETE
        PostWorkout:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/workout
            Method: POST
        PostWorkoutAnnotate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/workout/{date}/{workout_id}/annotate
            Method: POST
        PostWorkoutFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/workout/{date}/{workout_id}/feedback
            Method: POST
        PostCalibration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/calibration/reference
            Method: POST
        GetCalibration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/calibration/reference
            Method: GET
        PostFeedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/feedback
            Method: POST
        PostEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/event
            Method: POST

  CoachFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/coach/
      Handler: run.sh
      Timeout: 120
      MemorySize: 1024
      Layers:
        - !Sub 'arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27'
        - !Ref SharedLayer
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: '8080'
          AWS_LWA_INVOKE_MODE: response_stream
          NUTRITION_FUNCTION_NAME: !Sub '${AWS::StackName}-NutritionFunction'
          # Lambda Web Adapter spawns `python -m uvicorn` in a subprocess,
          # which does NOT inherit the runtime's auto-injected /opt/python path.
          # Without this, `from shared.*` fails with ModuleNotFoundError.
          PYTHONPATH: /opt/python:/var/task
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NutritionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref JournalTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkoutsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExercisesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DailyScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HealthMetricsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserConfigTable
        - DynamoDBReadPolicy:
            TableName: !Ref BaselinesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CorrelationsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModelWithResponseStream
                - bedrock:InvokeModel
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-NutritionFunction'
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:fitness-api-key-*'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
            - x-api-key
          ExposeHeaders:
            - X-Conversation-Id
          MaxAge: 3600

  # ── Cost guardrail ──────────────────────────────────────────
  # Filtered to the services this stack uses so co-tenant workloads in the
  # same account don't trip the alarm. Keep in sync with
  # shared/cost_service.py FITNESS_APP_SERVICES. Email notifications don't
  # need SNS — Budgets delivers direct.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetMonthlyUsd
          Unit: USD
        CostFilters:
          Service:
            - AWS Lambda
            - Amazon DynamoDB
            - Amazon Bedrock
            - Amazon API Gateway
            - AWS Secrets Manager
            - AmazonCloudWatch
            - Amazon CloudWatch
            - Amazon EventBridge
            - AWS CloudFormation
            - AWS CloudTrail
            - Amazon Simple Storage Service
            - AWS Key Management Service
          Region:
            - us-west-2
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  IngestHealthUrl:
    Description: HealthAutoExport target URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/ingest/health'
  CoachFunctionUrl:
    Description: Streaming coach Function URL (set as VITE_COACH_URL in Vercel)
    Value: !GetAtt CoachFunctionUrl.FunctionUrl
