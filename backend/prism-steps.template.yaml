AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated PRISM Steps reader; fixed pilot default, reviewed daily opt-in

Parameters:
  HealthMetricsTableName:
    Type: String
    Default: fitness-health-metrics
    AllowedValues: [fitness-health-metrics]
  AllowedDate:
    Type: String
    Default: '2026-10-23'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
    Description: The only source-day partition this pilot may read
  AccessMode:
    Type: String
    Default: pilot
    AllowedValues: [pilot, daily]
  DailyAnchor:
    Type: String
    Default: '2026-10-25'
    AllowedPattern: '^\d{4}-\d{2}-\d{2}$'
    Description: Frozen first Pacific operation date; regenerate and review if stale
  DailyApprovedDates:
    Type: CommaDelimitedList
    Default: '2026-10-22,2026-10-23,2026-10-24,2026-10-25,2026-10-26,2026-10-27,2026-10-28,2026-10-29,2026-10-30,2026-10-31,2026-11-01,2026-11-02,2026-11-03,2026-11-04,2026-11-05,2026-11-06,2026-11-07,2026-11-08,2026-11-09,2026-11-10,2026-11-11,2026-11-12,2026-11-13,2026-11-14,2026-11-15,2026-11-16,2026-11-17,2026-11-18,2026-11-19,2026-11-20,2026-11-21,2026-11-22,2026-11-23,2026-11-24,2026-11-25,2026-11-26,2026-11-27,2026-11-28,2026-11-29,2026-11-30,2026-12-01,2026-12-02,2026-12-03,2026-12-04,2026-12-05,2026-12-06,2026-12-07,2026-12-08,2026-12-09,2026-12-10,2026-12-11,2026-12-12,2026-12-13,2026-12-14,2026-12-15,2026-12-16,2026-12-17,2026-12-18,2026-12-19,2026-12-20,2026-12-21,2026-12-22,2026-12-23,2026-12-24,2026-12-25,2026-12-26,2026-12-27,2026-12-28,2026-12-29,2026-12-30,2026-12-31,2027-01-01,2027-01-02,2027-01-03,2027-01-04,2027-01-05,2027-01-06,2027-01-07,2027-01-08,2027-01-09,2027-01-10,2027-01-11,2027-01-12,2027-01-13,2027-01-14,2027-01-15,2027-01-16,2027-01-17,2027-01-18,2027-01-19,2027-01-20,2027-01-21'
    Description: Frozen exact 92-date partition perimeter; no wildcard or renewal job
  StepsSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-west-2:[0-9]{12}:secret:prism-steps-read-[A-Za-z0-9_-]+$'
    Description: Dedicated enabled/token_sha256/expires_at secret; never fitness-api-key

Conditions:
  DailyMode: !Equals [!Ref AccessMode, daily]

Resources:
  StepsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 1

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: shared/
      CompatibleRuntimes: [python3.13]
    Metadata:
      BuildMethod: makefile

  StepsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/prism_steps/
      Handler: handler.lambda_handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128
      Layers: [!Ref SharedLayer]
      Environment:
        Variables:
          HEALTH_METRICS_TABLE: !Ref HealthMetricsTableName
          PRISM_STEPS_ACCESS_MODE: !Ref AccessMode
          PRISM_STEPS_DAILY_ANCHOR: !Ref DailyAnchor
          PRISM_STEPS_DAILY_APPROVED_DATES: !Join [",", !Ref DailyApprovedDates]
          PRISM_STEPS_ALLOWED_DATE: !Ref AllowedDate
          PRISM_STEPS_SECRET_ARN: !Ref StepsSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${HealthMetricsTableName}'
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: !If [DailyMode, !Ref DailyApprovedDates, [!Ref AllowedDate]]
                "Null":
                  dynamodb:LeadingKeys: false
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref StepsSecretArn
      Events:
        GetSteps:
          Type: HttpApi
          Properties:
            ApiId: !Ref StepsApi
            Path: /api/prism/steps
            Method: GET

Outputs:
  StepsUrl:
    Description: Fixed-origin server-side PRISM source endpoint (not a phone destination)
    Value: !Sub 'https://${StepsApi}.execute-api.${AWS::Region}.amazonaws.com/api/prism/steps'
